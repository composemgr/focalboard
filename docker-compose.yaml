# nginx proxy address - http://172.17.0.1:8092

name: focalboard
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  focalboard:
    image: mattermost/focalboard:latest
    pull_policy: always
    container_name: focalboard-app
    restart: always
    logging: *default-logging
    networks:
      - focalboard
    ports:
      - "172.17.0.1:8092:8000"
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./volumes/data/focalboard:/data
    depends_on:
      - focalboard-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3

  focalboard-db:
    image: postgres:latest
    pull_policy: always
    container_name: focalboard-db
    restart: always
    logging: *default-logging
    networks:
      - focalboard
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-focalboard}
      POSTGRES_USER: ${DB_USER_NAME:-focalboard}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - ./volumes/data/db/postgres/focalboard:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  focalboard:
    name: focalboard
    external: false
